<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUCHI Jewellery | Handcrafted Kundan & Artificial Jewellery</title>
    <script>
      (function() {
        var path = window.location.pathname;
        // Ensure trailing slash for directory access on GitHub Pages
        if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
          return;
        }
        // Set base href dynamically for asset resolution
        var base = document.createElement('base');
        base.href = window.location.origin + (path.endsWith('/') ? path : path.substring(0, path.lastIndexOf('/') + 1));
        document.head.appendChild(base);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FFFBFB] text-[#2D2D2D] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
